<script>
    const game = {
        db: {},
        state: { view: 'menu', disaster: null, threat: null, candidates: [], round: 1 },

        // Асинхронная загрузка файлов из папки /db
        async init() {
            try {
                const files = ['names', 'scenarios', 'biology', 'professions', 'health', 'hobby', 'baggage', 'facts'];
                const promises = files.map(file => fetch(`./db/${file}.json`).then(res => {
                    if (!res.ok) throw new Error(`HTTP Error: ${res.status} на файле ${file}.json`);
                    return res.json();
                }));
                
                const [names, scenarios, biology, professions, health, hobby, baggage, facts] = await Promise.all(promises);
                
                this.db.names = names;
                this.db.disasters = scenarios.disasters;
                this.db.threats = scenarios.threats;
                
                // Теперь мы просто присваиваем массивы напрямую из JSON
                this.db.professions = professions;
                this.db.health = health;
                this.db.hobby = hobby;
                this.db.baggage = baggage;
                this.db.facts = facts;
                
                // Генерация биологии остаётся программной, так как это просто цикл (Пол + Возраст + Тип)
                this.db.biology = [];
                biology.genders.forEach(g => {
                    biology.bodies.forEach(b => {
                        for(let age = 18; age <= 65; age += 2) {
                            let s = { ...b.s };
                            if (age < 30) { s.psy += 1; s.med -= 1; }
                            else if (age > 45) { s.psy -= 1; s.med += 1; }
                            this.db.biology.push({ gender: g, name: `${g}, ${age} лет, ${b.n} телосложение`, stats: s });
                        }
                    });
                });

                ui.render();
            } catch (error) {
                document.getElementById('loader').innerHTML = `<span class="text-red-500">Ошибка загрузки баз: ${error.message}.<br>Убедитесь, что запускаете игру через локальный сервер.</span>`;
                console.error(error);
            }
        },

        getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

        generateName(genderStr) {
            const isMale = genderStr === "Мужчина";
            const firstNames = isMale ? this.db.names.male : this.db.names.female;
            let surname = this.getRandom(this.db.names.surnames);
            if (!isMale) surname += "а"; 
            return `${this.getRandom(firstNames)} ${surname}`;
        },

        getCardValue(card) {
            return (card.stats.eng || 0) + (card.stats.med || 0) + (card.stats.prov || 0) + (card.stats.psy || 0);
        },

        start() {
            this.state.disaster = this.getRandom(this.db.disasters);
            this.state.threat = this.getRandom(this.db.threats);
            this.state.candidates = [];
            this.state.round = 1;

            const usedP = new Set(), usedH = new Set(), usedHob = new Set(), usedB = new Set(), usedF = new Set(), usedBio = new Set();
            
            const getUnique = (pool, usedSet) => {
                let available = pool.filter(item => !usedSet.has(item.name));
                if (available.length === 0) available = pool; // Если база маленькая, разрешаем повторы
                const item = this.getRandom(available);
                usedSet.add(item.name);
                return item;
            };

            for (let i = 0; i < 10; i++) {
                const bioData = getUnique(this.db.biology, usedBio);
                let otherCards = [
                    { label: 'Биология', ...bioData },
                    { label: 'Здоровье', ...getUnique(this.db.health, usedH) },
                    { label: 'Хобби', ...getUnique(this.db.hobby, usedHob) },
                    { label: 'Багаж', ...getUnique(this.db.baggage, usedB) },
                    { label: 'Факт', ...getUnique(this.db.facts, usedF) }
                ];

                // Сортируем 5 скрытых карт от лучшей к худшей по сумме характеристик
                otherCards.sort((a, b) => this.getCardValue(b) - this.getCardValue(a));
                
                let myCards = [
                    { label: 'Профессия', ...getUnique(this.db.professions, usedP) },
                    ...otherCards
                ];
                
                this.state.candidates.push({
                    id: i,
                    fullName: this.generateName(bioData.gender),
                    cards: myCards,
                    eliminated: false
                });
            }
            this.state.view = 'playing';
            ui.render();
        },

        eliminate(id) {
            const c = this.state.candidates.find(c => c.id === id);
            if(c) c.eliminated = true;

            const aliveCount = this.state.candidates.filter(c => !c.eliminated).length;
            if (aliveCount <= 5) this.state.view = 'simulation';
            else this.state.round = 10 - aliveCount + 1;
            ui.render();
        },

        simulate() {
            const survivors = this.state.candidates.filter(c => !c.eliminated);
            let totals = { eng: 0, med: 0, prov: 0, psy: 0 };
            let threatResolved = false;

            survivors.forEach(c => {
                c.cards.forEach(card => {
                    totals.eng += card.stats.eng || 0;
                    totals.med += card.stats.med || 0;
                    totals.prov += card.stats.prov || 0;
                    totals.psy += card.stats.psy || 0;
                    
                    // Проверка решения угрозы по ключевым словам
                    if (this.state.threat.overcome.some(keyword => card.name.toLowerCase().includes(keyword.toLowerCase()))) {
                        threatResolved = true;
                    }
                });
            });

            if (!threatResolved) { totals.psy -= 10; totals.med -= 10; }

            const req = this.state.disaster.req;
            const results = {
                eng: { val: totals.eng, req: req.eng, pass: totals.eng >= req.eng },
                med: { val: totals.med, req: req.med, pass: totals.med >= req.med },
                prov: { val: totals.prov, req: req.prov, pass: totals.prov >= req.prov },
                psy: { val: totals.psy, req: req.psy, pass: totals.psy >= req.psy }
            };

            return { results, threatResolved, win: Object.values(results).filter(r => r.pass).length >= 3 };
        }
    };

    const ui = {
        render() {
            const root = document.getElementById('app-root');
            if (game.state.view === 'menu') root.innerHTML = this.viewMenu();
            else if (game.state.view === 'playing') root.innerHTML = this.viewGame();
            else if (game.state.view === 'simulation') root.innerHTML = this.viewSimulation();
        },

        viewMenu() {
            return `
            <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
                <h2 class="text-4xl md:text-6xl font-bold uppercase mb-2 text-white tracking-wider">Комитет <span class="text-bunker-accent">Спасения</span></h2>
                <p class="text-gray-400 mb-8 max-w-xl text-sm md:text-base">Базы успешно загружены. <br>В 1-м раунде всегда открывается Профессия. Далее карты вскрываются от самых полезных к самым проблемным.</p>
                <button onclick="game.start()" class="bg-bunker-accent text-bunker-900 font-bold text-xl px-10 py-3 rounded shadow hover:bg-yellow-400 transition transform hover:scale-105">Начать игру</button>
            </div>`;
        },

        viewGame() {
            const st = game.state;
            const alive = st.candidates.filter(c => !c.eliminated).length;
            let html = `
            <div class="flex-shrink-0 bg-bunker-800 border border-bunker-700 p-2 rounded mb-1 flex justify-between items-center shadow">
                <div>
                    <div class="text-bunker-accent font-bold text-sm md:text-base uppercase leading-tight">Раунд ${st.round} из 5</div>
                    <div class="text-[10px] md:text-xs text-gray-400">Катастрофа: <span class="text-white">${st.disaster.name}</span></div>
                </div>
                <div class="text-right">
                    <div class="text-lg md:text-xl font-bold text-white leading-tight"><span class="text-bunker-accent">${alive}</span>/10</div>
                    <div class="text-[9px] text-gray-500 uppercase tracking-widest">Осталось</div>
                </div>
            </div>
            <div class="flex-grow grid grid-cols-2 md:grid-cols-5 grid-rows-5 md:grid-rows-2 gap-1.5 min-h-0 pb-1">`;

            st.candidates.forEach(c => {
                const isE = c.eliminated;
                html += `
                <div class="card-tv bg-bunker-800 border border-bunker-700 rounded p-1.5 flex flex-col h-full overflow-hidden ${isE ? 'eliminated' : ''}" tabindex="0">
                    <div class="border-b border-bunker-700 pb-1 mb-1 flex-shrink-0 text-center">
                        <div class="font-bold text-sm text-white truncate leading-tight">${c.fullName}</div>
                    </div>
                    <div class="flex-grow flex flex-col justify-evenly">`;

                c.cards.forEach((card, index) => {
                    let isVisible = isE || false;
                    if (!isE) {
                        if (st.round === 1) isVisible = (index === 0);
                        else if (st.round === 2) isVisible = (index <= 1);
                        else if (st.round === 3) isVisible = (index <= 2);
                        else if (st.round === 4) isVisible = (index <= 3);
                        else if (st.round === 5) isVisible = true;
                    }
                    html += `
                        <div class="flex flex-col justify-center">
                            <span class="text-[8px] md:text-[9px] text-gray-500 uppercase tracking-widest leading-none mb-[2px]">${card.label}</span>
                            ${isVisible 
                                ? `<div class="font-bold text-gray-200 text-[11px] truncate leading-tight" title="${card.name}">${card.name}</div>` 
                                : `<div class="hidden-trait h-3.5 md:h-4 w-full rounded"></div>`
                            }
                        </div>`;
                });

                html += `
                    </div>
                    <div class="flex-shrink-0 mt-1">
                        ${!isE ? `<button onclick="game.eliminate(${c.id})" class="w-full bg-red-900/40 hover:bg-red-700 text-red-200 text-xs font-bold py-1 rounded transition border border-red-800 focus:outline-none">ИЗГНАТЬ</button>` 
                               : `<div class="w-full text-center text-red-500 text-xs font-bold py-1 uppercase tracking-widest border border-red-900/50 bg-red-900/10 rounded">ИЗГНАН</div>`}
                    </div>
                </div>`;
            });
            return html + `</div>`;
        },

        viewSimulation() {
            const sim = game.simulate();
            const renderStat = (name, data) => `
                <div class="flex justify-between items-center py-2 border-b border-bunker-700">
                    <span class="text-gray-300 text-sm">${name}</span>
                    <span class="font-bold text-base ${data.pass ? 'text-green-400' : 'text-red-400'}">${data.val} <span class="text-xs text-gray-500">/ ${data.req}</span></span>
                </div>`;

            return `
            <div class="flex-grow flex flex-col items-center justify-center">
                <div class="w-full max-w-3xl bg-bunker-800 p-6 rounded-lg border border-bunker-700 shadow-xl">
                    <h2 class="text-3xl font-black text-center mb-2 ${sim.win ? 'text-green-500' : 'text-red-500'} uppercase tracking-widest">
                        ${sim.win ? 'Бункер выжил' : 'Бункер пал'}
                    </h2>
                    <p class="text-center text-gray-400 mb-6 text-sm">После катастрофы: <span class="text-white font-bold">${game.state.disaster.name}</span></p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="bg-bunker-900/50 p-4 rounded border border-bunker-700">
                            <h3 class="text-sm font-bold text-bunker-accent mb-3 uppercase tracking-wider">Итоги (скрытые статы)</h3>
                            ${renderStat('Инженерия', sim.results.eng)}
                            ${renderStat('Медицина', sim.results.med)}
                            ${renderStat('Провизия', sim.results.prov)}
                            ${renderStat('Психика', sim.results.psy)}
                        </div>
                        
                        <div class="bg-bunker-900/50 p-4 rounded border border-bunker-700 flex flex-col">
                            <h3 class="text-sm font-bold text-bunker-accent mb-3 uppercase tracking-wider">Угроза внутри</h3>
                            <div class="mb-1 text-white font-bold text-sm">${game.state.threat.name}</div>
                            <div class="text-gray-400 mb-4 text-xs flex-grow">${game.state.threat.desc}</div>
                            
                            <div class="p-2 rounded text-xs ${sim.threatResolved ? 'bg-green-900/20 border-green-800 text-green-400' : 'bg-red-900/20 border-red-800 text-red-400'} border font-bold">
                                ${sim.threatResolved ? '✓ Угроза успешно устранена' : '✗ Штраф -10 к Психике и Медицине'}
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button onclick="game.state.view='menu'; ui.render();" class="bg-bunker-700 hover:bg-gray-600 px-6 py-2 rounded text-white font-bold text-sm transition">В главное меню</button>
                    </div>
                </div>
            </div>`;
        }
    };

    // Точка входа
    game.init();
</script>
