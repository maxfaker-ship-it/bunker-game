<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комитет Спасения — Бункер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bunker: {
                            900: '#121417',
                            800: '#1a1d23',
                            700: '#262a33',
                            600: '#343b46',
                            accent: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
        
        .hidden-trait {
            background: repeating-linear-gradient(
                45deg,
                #262a33,
                #262a33 10px,
                #1a1d23 10px,
                #1a1d23 20px
            );
            border: 1px dashed #4b5563;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121417; }
        ::-webkit-scrollbar-thumb { background: #343b46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        .card-tv { transition: all 0.2s ease; }
        .card-tv.eliminated { opacity: 0.5; filter: grayscale(80%); }
    </style>
</head>
<body class="bg-bunker-900 text-gray-100 h-full flex flex-col overflow-hidden select-none">

    <header class="bg-bunker-800 border-b border-bunker-700 px-4 py-3 flex justify-between items-center flex-shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
            <h1 class="font-bold tracking-wider text-sm md:text-base uppercase text-white">ПРОЕКТ <span class="text-bunker-accent">«БУНКЕР»</span></h1>
        </div>
        <div id="loader" class="text-xs text-gray-400">
            Загрузка баз данных...
        </div>
    </header>

    <main id="app-root" class="flex-grow flex flex-col p-2 md:p-4 max-w-[1600px] w-full mx-auto overflow-hidden">
        <div class="flex-grow flex items-center justify-center">
            <div class="text-bunker-accent text-lg animate-pulse">Инициализация систем убежища...</div>
        </div>
    </main>

    <script>
        const game = {
            db: {},
            state: { view: 'menu', disaster: null, threat: null, candidates: [], round: 1 },

            async init() {
                try {
                    const files = ['names', 'scenarios', 'biology', 'professions', 'health', 'hobby', 'baggage', 'facts'];
                    const promises = files.map(file => fetch(`./db/${file}.json`).then(res => {
                        if (!res.ok) throw new Error(`HTTP Error: ${res.status} на файле ${file}.json`);
                        return res.json();
                    }));
                    
                    const [names, scenarios, biology, professions, health, hobby, baggage, facts] = await Promise.all(promises);
                    
                    this.db.names = names;
                    this.db.disasters = scenarios.disasters;
                    this.db.threats = scenarios.threats;
                    this.db.professions = professions;
                    this.db.health = health;
                    this.db.hobby = hobby;
                    this.db.baggage = baggage;
                    this.db.facts = facts;
                    this.db.biology = biology;

                    document.getElementById('loader').innerHTML = '<span class="text-green-400">Базы загружены</span>';
                    ui.render();
                } catch (error) {
                    document.getElementById('loader').innerHTML = `<span class="text-red-500">Ошибка загрузки баз</span>`;
                    document.getElementById('app-root').innerHTML = `
                        <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
                            <div class="bg-red-900/20 border border-red-800 p-6 rounded-lg max-w-lg">
                                <h3 class="text-xl font-bold text-red-400 mb-2">Ошибка инициализации баз данных</h3>
                                <p class="text-gray-300 text-sm mb-4">${error.message}</p>
                                <p class="text-gray-400 text-xs">Убедитесь, что папка <code class="text-bunker-accent">db</code> со всеми JSON-файлами находится в корне репозитория.</p>
                            </div>
                        </div>`;
                    console.error(error);
                }
            },

            getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

            generateName(bioName) {
                const isMale = bioName.toLowerCase().startsWith('мужчина');
                const firstNames = isMale ? this.db.names.male : this.db.names.female;
                let surname = this.getRandom(this.db.names.surnames);
                if (!isMale && !surname.endsWith('а') && !surname.endsWith('я')) surname += "а"; 
                return `${this.getRandom(firstNames)} ${surname}`;
            },

            getCardValue(card) {
                return (card.stats.eng || 0) + (card.stats.med || 0) + (card.stats.prov || 0) + (card.stats.psy || 0);
            },

            start() {
                this.state.disaster = this.getRandom(this.db.disasters);
                this.state.threat = this.getRandom(this.db.threats);
                this.state.candidates = [];
                this.state.round = 1;

                const usedP = new Set(), usedH = new Set(), usedHob = new Set(), usedB = new Set(), usedF = new Set(), usedBio = new Set();
                
                const getUnique = (pool, usedSet) => {
                    let available = pool.filter(item => !usedSet.has(item.name));
                    if (available.length === 0) available = pool; 
                    const item = this.getRandom(available);
                    usedSet.add(item.name);
                    return item;
                };

                for (let i = 0; i < 10; i++) {
                    const bioData = getUnique(this.db.biology, usedBio);
                    
                    const professionCard = { label: 'Профессия', ...getUnique(this.db.professions, usedP) };
                    const biologyCard = { label: 'Биология', ...bioData };
                    const factCard = { label: 'Факт', ...getUnique(this.db.facts, usedF), _isSecret: true };

                    // Набор карт для сортировки от лучших к худшим (Биология, Здоровье, Хобби, Багаж)
                    let sortableCards = [
                        biologyCard,
                        { label: 'Здоровье', ...getUnique(this.db.health, usedH) },
                        { label: 'Хобби', ...getUnique(this.db.hobby, usedHob) },
                        { label: 'Багаж', ...getUnique(this.db.baggage, usedB) }
                    ];

                    // Сортируем от лучших к худшим по сумме характеристик (по убыванию)
                    sortableCards.sort((a, b) => this.getCardValue(b) - this.getCardValue(a));

                    // Итоговый порядок:
                    // Индекс 0: Профессия (всегда 1-й раунд)
                    // Индексы 1, 2, 3, 4: Сортированные карты от лучшей к худшей (включая биологию)
                    // Индекс 5: Факт (секретный)
                    let myCards = [
                        professionCard,
                        ...sortableCards,
                        factCard
                    ];
                    
                    this.state.candidates.push({
                        id: i,
                        fullName: this.generateName(bioData.name),
                        cards: myCards,
                        eliminated: false
                    });
                }
                this.state.view = 'playing';
                ui.render();
            },

            eliminate(id) {
                const c = this.state.candidates.find(c => c.id === id);
                if(c) c.eliminated = true;

                const aliveCount = this.state.candidates.filter(c => !c.eliminated).length;
                if (aliveCount <= 5) this.state.view = 'simulation';
                else this.state.round = 10 - aliveCount + 1;
                ui.render();
            },

            simulate() {
                const survivors = this.state.candidates.filter(c => !c.eliminated);
                let totals = { eng: 0, med: 0, prov: 0, psy: 0 };
                let threatResolved = false;

                survivors.forEach(c => {
                    c.cards.forEach(card => {
                        totals.eng += card.stats.eng || 0;
                        totals.med += card.stats.med || 0;
                        totals.prov += card.stats.prov || 0;
                        totals.psy += card.stats.psy || 0;
                        
                        if (this.state.threat.overcome.some(keyword => card.name.toLowerCase().includes(keyword.toLowerCase()))) {
                            threatResolved = true;
                        }
                    });
                });

                if (!threatResolved) { totals.psy -= 10; totals.med -= 10; }

                const req = this.state.disaster.req;
                const results = {
                    eng: { val: totals.eng, req: req.eng, pass: totals.eng >= req.eng },
                    med: { val: totals.med, req: req.med, pass: totals.med >= req.med },
                    prov: { val: totals.prov, req: req.prov, pass: totals.prov >= req.prov },
                    psy: { val: totals.psy, req: req.psy, pass: totals.psy >= req.psy }
                };

                return { results, threatResolved, win: Object.values(results).filter(r => r.pass).length >= 3 };
            }
        };

        const ui = {
            render() {
                const root = document.getElementById('app-root');
                if (game.state.view === 'menu') root.innerHTML = this.viewMenu();
                else if (game.state.view === 'playing') root.innerHTML = this.viewGame();
                else if (game.state.view === 'simulation') root.innerHTML = this.viewSimulation();
            },

            viewMenu() {
                return `
                <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
                    <h2 class="text-4xl md:text-6xl font-bold uppercase mb-2 text-white tracking-wider">Комитет <span class="text-bunker-accent">Спасения</span></h2>
                    <p class="text-gray-400 mb-8 max-w-xl text-sm md:text-base">1 раунд — профессия (имена скрыты). Со 2 по 5 раунды характеристики вскрываются от лучших к худшим. Имя открывается в момент вскрытия биологии. Факт остается секретным.</p>
                    <button onclick="game.start()" class="bg-bunker-accent text-bunker-900 font-bold text-xl px-10 py-3 rounded shadow hover:bg-yellow-400 transition transform hover:scale-105">Начать игру</button>
                </div>`;
            },

            viewGame() {
                const st = game.state;
                const alive = st.candidates.filter(c => !c.eliminated).length;
                let html = `
                <div class="flex-shrink-0 bg-bunker-800 border border-bunker-700 p-2.5 rounded mb-2 shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-bunker-accent font-bold text-sm uppercase">Раунд ${st.round} из 5</span>
                            <span class="text-xs bg-bunker-700 text-gray-300 px-2 py-0.5 rounded">Катастрофа: <b>${st.disaster.name}</b></span>
                        </div>
                        <div class="text-[11px] text-gray-400 mt-0.5 max-w-3xl"><b>О катастрофе:</b> ${st.disaster.desc}</div>
                        <div class="text-[11px] text-bunker-accent mt-0.5"><b>Требования для выживания:</b> Инженерия: ${st.disaster.req.eng}, Медицина: ${st.disaster.req.med}, Провизия: ${st.disaster.req.prov}, Психика: ${st.disaster.req.psy}</div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-lg font-bold text-white"><span class="text-bunker-accent">${alive}</span>/10</div>
                        <div class="text-[9px] text-gray-500 uppercase tracking-widest">В бункере</div>
                    </div>
                </div>
                <div class="flex-grow grid grid-cols-2 md:grid-cols-5 grid-rows-5 md:grid-rows-2 gap-1.5 min-h-0 pb-1 overflow-y-auto">`;

                st.candidates.forEach((c, idx) => {
                    const isE = c.eliminated;
                    
                    // Имя открывается только тогда, когда у кандидата вскрыта карта "Биология"
                    let isBioVisible = false;
                    c.cards.forEach((card, index) => {
                        let isCardOpen = isE || (!card._isSecret && index < st.round);
                        if (card.label === 'Биология' && isCardOpen) {
                            isBioVisible = true;
                        }
                    });
                    const displayName = isBioVisible ? c.fullName : `Кандидат #${idx + 1}`;

                    html += `
                    <div class="card-tv bg-bunker-800 border border-bunker-700 rounded p-1.5 flex flex-col h-full overflow-hidden ${isE ? 'eliminated' : ''}">
                        <div class="border-b border-bunker-700 pb-1 mb-1 flex-shrink-0 text-center">
                            <div class="font-bold text-xs md:text-sm text-white truncate leading-tight">${displayName}</div>
                        </div>
                        <div class="flex-grow flex flex-col justify-evenly overflow-y-auto">`;

                    c.cards.forEach((card, index) => {
                        let isVisible = isE || false;
                        if (!isE) {
                            if (!card._isSecret) {
                                if (index < st.round) isVisible = true;
                            }
                        }
                        
                        let statsStr = ` [eng:${card.stats.eng}, med:${card.stats.med}, prov:${card.stats.prov}, psy:${card.stats.psy}]`;
                        html += `
                            <div class="flex flex-col justify-center my-0.5">
                                <span class="text-[8px] md:text-[9px] text-gray-500 uppercase tracking-widest leading-none mb-[2px]">${card.label}</span>
                                ${isVisible 
                                    ? `<div class="font-bold text-gray-200 text-[10px] md:text-[11px] truncate leading-tight" title="${card.name}${statsStr}">${card.name} <span class="text-[9px] text-gray-400 font-normal">(${card.stats.eng},${card.stats.med},${card.stats.prov},${card.stats.psy})</span></div>` 
                                    : `<div class="hidden-trait h-3.5 md:h-4 w-full rounded"></div>`
                                }
                            </div>`;
                    });

                    html += `
                        </div>
                        <div class="flex-shrink-0 mt-1">
                            ${!isE ? `<button onclick="game.eliminate(${c.id})" class="w-full bg-red-900/40 hover:bg-red-700 text-red-200 text-[10px] md:text-xs font-bold py-1 rounded transition border border-red-800 focus:outline-none uppercase">Изгнать</button>` 
                                   : `<div class="w-full text-center text-red-500 text-[10px] md:text-xs font-bold py-1 uppercase tracking-widest border border-red-900/50 bg-red-900/10 rounded" title="Изгнан ранее">Изгнан</div>`}
                        </div>
                    </div>`;
                });
                return html + `</div>`;
            },

            viewSimulation() {
                const sim = game.simulate();
                const survivors = game.state.candidates.filter(c => !c.eliminated);
                const eliminated = game.state.candidates.filter(c => c.eliminated);

                const renderStat = (name, data) => `
                    <div class="flex justify-between items-center py-1.5 border-b border-bunker-700 text-xs">
                        <span class="text-gray-300">${name}</span>
                        <span class="font-bold ${data.pass ? 'text-green-400' : 'text-red-400'}">${data.val} / ${data.req}</span>
                    </div>`;

                const renderCandidateCard = (c, isOut = false) => `
                    <div class="bg-bunker-900 p-2 rounded border ${isOut ? 'border-red-900/50 opacity-75' : 'border-bunker-700'} text-xs">
                        <div class="font-bold text-white mb-1 border-b border-bunker-800 pb-1 flex justify-between">
                            <span>${c.fullName}</span>
                            <span class="${isOut ? 'text-red-400' : 'text-green-400'}">${isOut ? 'Изгнан' : 'В бункере'}</span>
                        </div>
                        <div class="space-y-0.5 text-[11px] text-gray-300">
                            ${c.cards.map(card => `<div><span class="text-gray-500">${card.label}:</span>${card.name} <span class="text-gray-400 text-[10px]">(${card.stats.eng},${card.stats.med},${card.stats.prov},${card.stats.psy})</span></div>`).join('')}
                        </div>
                    </div>`;

                return `
                <div class="flex-grow flex flex-col items-center justify-center overflow-y-auto py-4 px-2">
                    <div class="w-full max-w-4xl bg-bunker-800 p-6 rounded-lg border border-bunker-700 shadow-xl">
                        <h2 class="text-3xl font-black text-center mb-1 ${sim.win ? 'text-green-500' : 'text-red-500'} uppercase tracking-widest">
                            ${sim.win ? 'Бункер выжил' : 'Бункер пал'}
                        </h2>
                        <p class="text-center text-gray-400 mb-4 text-xs">Катастрофа: <span class="text-white font-bold">${game.state.disaster.name}</span> — ${game.state.disaster.desc}</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div class="bg-bunker-900/50 p-3 rounded border border-bunker-700">
                                <h3 class="text-xs font-bold text-bunker-accent mb-2 uppercase tracking-wider">Итоги характеристик бункера</h3>
                                ${renderStat('Инженерия', sim.results.eng)}
                                ${renderStat('Медицина', sim.results.med)}
                                ${renderStat('Провизия', sim.results.prov)}
                                ${renderStat('Психика', sim.results.psy)}
                            </div>
                            
                            <div class="bg-bunker-900/50 p-3 rounded border border-bunker-700 flex flex-col">
                                <h3 class="text-xs font-bold text-bunker-accent mb-2 uppercase tracking-wider">Угроза убежища</h3>
                                <div class="mb-1 text-white font-bold text-xs">${game.state.threat.name}</div>
                                <div class="text-gray-400 mb-2 text-[11px] flex-grow">${game.state.threat.desc}</div>
                                <div class="p-2 rounded text-[11px] ${sim.threatResolved ? 'bg-green-900/20 border-green-800 text-green-400' : 'bg-red-900/20 border-red-800 text-red-400'} border font-bold">
                                    ${sim.threatResolved ? '✓ Угроза успешно устранена' : '✗ Угроза не устранена (-10 к Медицине и Психике)'}
                                </div>
                            </div>
                        </div>

                        <h3 class="text-xs font-bold text-bunker-accent mb-2 uppercase tracking-wider">Состав выживших в бункере (5 человек):</h3>
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-4">
                            ${survivors.map(c => renderCandidateCard(c, false)).join('')}
                        </div>

                        ${eliminated.length > 0 ? `
                            <h3 class="text-xs font-bold text-red-400 mb-2 uppercase tracking-wider">Изгнанные ранее персонажи:</h3>
                            <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-6">
                                ${eliminated.map(c => renderCandidateCard(c, true)).join('')}
                            </div>
                        ` : ''}

                        <div class="text-center">
                            <button onclick="game.state.view='menu'; ui.render();" class="bg-bunker-700 hover:bg-gray-600 px-6 py-2 rounded text-white font-bold text-xs transition">В главное меню</button>
                        </div>
                    </div>
                </div>`;
            }
        };

        game.init();
    </script>
</body>
</html>
