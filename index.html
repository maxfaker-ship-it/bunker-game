<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комитет Спасения — Бункер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bunker: {
                            900: '#121417',
                            800: '#1a1d23',
                            700: '#262a33',
                            600: '#343b46',
                            accent: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
        
        .hidden-trait {
            background: repeating-linear-gradient(
                45deg,
                #262a33,
                #262a33 8px,
                #1a1d23 8px,
                #1a1d23 16px
            );
            border: 1px dashed #4b5563;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121417; }
        ::-webkit-scrollbar-thumb { background: #343b46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        .card-tv { transition: all 0.2s ease; }
        .card-tv.eliminated { opacity: 0.5; filter: grayscale(80%); }
    </style>
</head>
<body class="bg-bunker-900 text-gray-100 h-full flex flex-col overflow-hidden select-none">

    <header class="bg-bunker-800 border-b border-bunker-700 px-3 py-2 flex justify-between items-center flex-shrink-0 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></div>
            <h1 class="font-bold tracking-wider text-xs md:text-sm uppercase text-white">ПРОЕКТ <span class="text-bunker-accent">«БУНКЕР»</span></h1>
        </div>
        <div id="loader" class="text-xs text-gray-400">
            Загрузка баз данных...
        </div>
    </header>

    <main id="app-root" class="flex-grow flex flex-col p-2 max-w-[1600px] w-full mx-auto overflow-hidden">
        <div class="flex-grow flex items-center justify-center">
            <div class="text-bunker-accent text-sm animate-pulse">Инициализация систем убежища...</div>
        </div>
    </main>

    <script>
        const game = {
            db: {},
            state: { view: 'menu', disaster: null, threat: null, candidates: [], round: 1 },

            async init() {
                try {
                    const files = ['names', 'scenarios', 'biology', 'professions', 'health', 'hobby', 'baggage', 'facts'];
                    const promises = files.map(file => fetch(`./db/${file}.json`).then(res => {
                        if (!res.ok) throw new Error(`HTTP Error: ${res.status} на файле ${file}.json`);
                        return res.json();
                    }));
                    
                    const [names, scenarios, biology, professions, health, hobby, baggage, facts] = await Promise.all(promises);
                    
                    this.db.names = names;
                    this.db.disasters = scenarios.disasters;
                    this.db.threats = scenarios.threats;
                    this.db.professions = professions;
                    this.db.health = health;
                    this.db.hobby = hobby;
                    this.db.baggage = baggage;
                    this.db.facts = facts;
                    this.db.biology = biology;

                    document.getElementById('loader').innerHTML = '<span class="text-green-400">Базы загружены</span>';
                    ui.render();
                } catch (error) {
                    document.getElementById('loader').innerHTML = `<span class="text-red-500">Ошибка загрузки баз</span>`;
                    document.getElementById('app-root').innerHTML = `
                        <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
                            <div class="bg-red-900/20 border border-red-800 p-6 rounded-lg max-w-lg">
                                <h3 class="text-xl font-bold text-red-400 mb-2">Ошибка инициализации баз данных</h3>
                                <p class="text-gray-300 text-sm mb-4">${error.message}</p>
                                <p class="text-gray-400 text-xs">Убедитесь, что папка <code class="text-bunker-accent">db</code> со всеми JSON-файлами находится в корне репозитория.</p>
                            </div>
                        </div>`;
                    console.error(error);
                }
            },

            getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; },

            generateName(bioName) {
                const isMale = bioName.toLowerCase().startsWith('мужчина');
                const firstNames = isMale ? this.db.names.male : this.db.names.female;
                let surname = this.getRandom(this.db.names.surnames);
                if (!isMale && !surname.endsWith('а') && !surname.endsWith('я')) surname += "а"; 
                return `${this.getRandom(firstNames)} ${surname}`;
            },

            start() {
                this.state.disaster = this.getRandom(this.db.disasters);
                this.state.threat = this.getRandom(this.db.threats);
                this.state.candidates = [];
                this.state.round = 1;

                const usedP = new Set(), usedH = new Set(), usedHob = new Set(), usedB = new Set(), usedF = new Set(), usedBio = new Set();
                
                const getUnique = (pool, usedSet) => {
                    let available = pool.filter(item => !usedSet.has(item.name));
                    if (available.length === 0) available = pool; 
                    const item = this.getRandom(available);
                    usedSet.add(item.name);
                    return item;
                };

                for (let i = 0; i < 10; i++) {
                    const bioData = getUnique(this.db.biology, usedBio);
                    
                    // Фиксированный порядок слотов карт на экране: Профессия -> Биология -> Здоровье -> Хобби -> Багаж -> Факт
                    let myCards = [
                        { label: 'Профессия', ...getUnique(this.db.professions, usedP) },
                        { label: 'Биология', ...bioData },
                        { label: 'Здоровье', ...getUnique(this.db.health, usedH) },
                        { label: 'Хобби', ...getUnique(this.db.hobby, usedHob) },
                        { label: 'Багаж', ...getUnique(this.db.baggage, usedB) },
                        { label: 'Факт', ...getUnique(this.db.facts, usedF) }
                    ];
                    
                    this.state.candidates.push({
                        id: i,
                        fullName: this.generateName(bioData.name),
                        cards: myCards,
                        eliminated: false
                    });
                }
                this.state.view = 'playing';
                ui.render();
            },

            eliminate(id) {
                const c = this.state.candidates.find(c => c.id === id);
                if(c) c.eliminated = true;

                const aliveCount = this.state.candidates.filter(c => !c.eliminated).length;
                if (aliveCount <= 5) this.state.view = 'simulation';
                else this.state.round = 10 - aliveCount + 1;
                ui.render();
            },

            simulate() {
                const survivors = this.state.candidates.filter(c => !c.eliminated);
                let totals = { eng: 0, med: 0, prov: 0, psy: 0 };
                let threatResolved = false;

                survivors.forEach(c => {
                    c.cards.forEach(card => {
                        totals.eng += card.stats.eng || 0;
                        totals.med += card.stats.med || 0;
                        totals.prov += card.stats.prov || 0;
                        totals.psy += card.stats.psy || 0;
                        
                        if (this.state.threat.overcome.some(keyword => card.name.toLowerCase().includes(keyword.toLowerCase()))) {
                            threatResolved = true;
                        }
                    });
                });

                if (!threatResolved) { totals.psy -= 10; totals.med -= 10; }

                const req = this.state.disaster.req;
                const results = {
                    eng: { val: totals.eng, req: req.eng, pass: totals.eng >= req.eng },
                    med: { val: totals.med, req: req.med, pass: totals.med >= req.med },
                    prov: { val: totals.prov, req: req.prov, pass: totals.prov >= req.prov },
                    psy: { val: totals.psy, req: req.psy, pass: totals.psy >= req.psy }
                };

                return { results, threatResolved, win: Object.values(results).filter(r => r.pass).length >= 3 };
            }
        };

        const ui = {
            render() {
                const root = document.getElementById('app-root');
                if (game.state.view === 'menu') root.innerHTML = this.viewMenu();
                else if (game.state.view === 'playing') root.innerHTML = this.viewGame();
                else if (game.state.view === 'simulation') root.innerHTML = this.viewSimulation();
            },

            viewMenu() {
                return `
                <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
                    <h2 class="text-4xl md:text-5xl font-bold uppercase mb-2 text-white tracking-wider">Комитет <span class="text-bunker-accent">Спасения</span></h2>
                    <p class="text-gray-400 mb-6 max-w-xl text-xs md:text-sm">1 раунд — профессия. Порядок карт фиксирован, статы скрыты до изгнания или финала.</p>
                    <button onclick="game.start()" class="bg-bunker-accent text-bunker-900 font-bold text-lg px-8 py-2.5 rounded shadow hover:bg-yellow-400 transition transform hover:scale-105">Начать игру</button>
                </div>`;
            },

            viewGame() {
                const st = game.state;
                const alive = st.candidates.filter(c => !c.eliminated).length;
                let html = `
                <div class="flex-shrink-0 bg-bunker-800 border border-bunker-700 p-2 rounded mb-1.5 shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-1">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-bunker-accent font-bold text-xs uppercase">Раунд ${st.round} из 5</span>
                            <span class="text-[11px] bg-bunker-700 text-gray-300 px-1.5 py-0.5 rounded">Катастрофа: <b>${st.disaster.name}</b></span>
                        </div>
                        <div class="text-[10px] text-gray-400 mt-0.5 max-w-3xl"><b>О катастрофе:</b> ${st.disaster.desc}</div>
                        <div class="text-[10px] text-bunker-accent mt-0.5"><b>Требования:</b> Инж: ${st.disaster.req.eng}, Мед: ${st.disaster.req.med}, Пров: ${st.disaster.req.prov}, Пси: ${st.disaster.req.psy}</div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <div class="text-base font-bold text-white"><span class="text-bunker-accent">${alive}</span>/10</div>
                        <div class="text-[8px] text-gray-500 uppercase tracking-widest">В бункере</div>
                    </div>
                </div>
                <div class="flex-grow grid grid-cols-2 md:grid-cols-5 grid-rows-5 md:grid-rows-2 gap-1.5 min-h-0 pb-1 overflow-hidden">`;

                st.candidates.forEach((c, idx) => {
                    const isE = c.eliminated;
                    
                    let isBioVisible = false;
                    c.cards.forEach((card, index) => {
                        let isCardOpen = isE || (index < st.round && index < 5);
                        if (card.label === 'Биология' && isCardOpen) {
                            isBioVisible = true;
                        }
                    });
                    const displayName = isBioVisible ? c.fullName : `Кандидат #${idx + 1}`;

                    html += `
                    <div class="card-tv bg-bunker-800 border border-bunker-700 rounded p-1 flex flex-col h-full overflow-hidden ${isE ? 'eliminated' : ''}">
                        <div class="border-b border-bunker-700 pb-0.5 mb-0.5 flex-shrink-0 text-center">
                            <div class="font-bold text-[11px] md:text-xs text-white truncate leading-tight">${displayName}</div>
                        </div>
                        <div class="flex-grow flex flex-col justify-between overflow-hidden py-0.5">`;

                    c.cards.forEach((card, index) => {
                        let isVisible = isE || false;
                        if (!isE) {
                            if (index < st.round && index < 5) {
                                isVisible = true;
                            }
                        }
                        
                        let statsStr = isE ? ` <span class="text-[8px] text-gray-400">(${card.stats.eng},${card.stats.med},${card.stats.prov},${card.stats.psy})</span>` : '';
                        
                        html += `
                            <div class="flex flex-col justify-center my-0">
                                <span class="text-[7px] md:text-[8px] text-gray-500 uppercase tracking-widest leading-none mb-[1px]">${card.label}</span>
                                ${isVisible 
                                    ? `<div class="font-bold text-gray-200 text-[9px] md:text-[10px] truncate leading-tight" title="${card.name}">${card.name}${statsStr}</div>` 
                                    : `<div class="hidden-trait h-3 w-full rounded"></div>`
                                }
                            </div>`;
                    });

                    html += `
                        </div>
                        <div class="flex-shrink-0 mt-0.5">
                            ${!isE ? `<button onclick="game.eliminate(${c.id})" class="w-full bg-red-900/40 hover:bg-red-700 text-red-200 text-[9px] md:text-[10px] font-bold py-0.5 rounded transition border border-red-800 uppercase">Изгнать</button>` 
                                   : `<div class="w-full text-center text-red-500 text-[9px] md:text-[10px] font-bold py-0.5 uppercase tracking-widest border border-red-900/50 bg-red-900/10 rounded">Изгнан</div>`}
                        </div>
                    </div>`;
                });
                return html + `</div>`;
            },

            viewSimulation() {
                const sim = game.simulate();
                const survivors = game.state.candidates.filter(c => !c.eliminated);
                const eliminated = game.state.candidates.filter(c => !c.eliminated);

                const renderStat = (name, data) => `
                    <div class="flex justify-between items-center py-1 border-b border-bunker-700 text-xs">
                        <span class="text-gray-300">${name}</span>
                        <span class="font-bold ${data.pass ? 'text-green-400' : 'text-red-400'}">${data.val} / ${data.req}</span>
                    </div>`;

                const renderCandidateCard = (c, isOut = false) => {
                    let totalEng = 0, totalMed = 0, totalProv = 0, totalPsy = 0;
                    c.cards.forEach(card => {
                        totalEng += card.stats.eng || 0;
                        totalMed += card.stats.med || 0;
                        totalProv += card.stats.prov || 0;
                        totalPsy += card.stats.psy || 0;
                    });
                    const grandTotal = totalEng + totalMed + totalProv + totalPsy;

                    return `
                    <div class="bg-bunker-900 p-2 rounded border ${isOut ? 'border-red-900/50 opacity-80' : 'border-bunker-700'} text-xs flex flex-col justify-between">
                        <div>
                            <div class="font-bold text-white mb-1 border-b border-bunker-800 pb-1 flex justify-between items-center">
                                <span class="truncate" title="${c.fullName}">${c.fullName}</span>
                                <span class="text-[9px] px-1 py-0.5 rounded ${isOut ? 'bg-red-900/40 text-red-300' : 'bg-green-900/40 text-green-300'}">${isOut ? 'Изгнан' : 'В бункере'}</span>
                            </div>
                            <div class="space-y-0.5 text-[10px] text-gray-300 mb-2">
                                ${c.cards.map(card => `<div><span class="text-gray-500">${card.label}:</span>${card.name} <span class="text-gray-400 text-[9px]">(${card.stats.eng},${card.stats.med},${card.stats.prov},${card.stats.psy})</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="border-t border-bunker-800 pt-1 text-[10px] text-gray-400">
                            <div class="flex justify-between font-mono mb-0.5">
                                <span>Eng: ${totalEng}</span>
                                <span>Med: ${totalMed}</span>
                                <span>Prov: ${totalProv}</span>
                                <span>Psy: ${totalPsy}</span>
                            </div>
                            <div class="text-center font-bold text-bunker-accent">Итого: ${grandTotal}</div>
                        </div>
                    </div>`;
                };

                return `
                <div class="flex-grow flex flex-col items-center justify-center overflow-y-auto py-2 px-2">
                    <div class="w-full max-w-5xl bg-bunker-800 p-5 rounded-lg border border-bunker-700 shadow-xl">
                        <h2 class="text-2xl md:text-3xl font-black text-center mb-1 ${sim.win ? 'text-green-500' : 'text-red-500'} uppercase tracking-widest">
                            ${sim.win ? 'Бункер выжил' : 'Бункер пал'}
                        </h2>
                        <p class="text-center text-gray-400 mb-4 text-xs">Катастрофа: <span class="text-white font-bold">${game.state.disaster.name}</span> — ${game.state.disaster.desc}</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
                            <div class="bg-bunker-900/50 p-3 rounded border border-bunker-700">
                                <h3 class="text-xs font-bold text-bunker-accent mb-2 uppercase tracking-wider">Сравнение группы и требований катастрофы</h3>
                                ${renderStat('Инженерия', sim.results.eng)}
                                ${renderStat('Медицина', sim.results.med)}
                                ${renderStat('Провизия', sim.results.prov)}
                                ${renderStat('Психика', sim.results.psy)}
                            </div>
                            
                            <div class="bg-bunker-900/50 p-3 rounded border border-bunker-700 flex flex-col">
                                <h3 class="text-xs font-bold text-bunker-accent mb-2 uppercase tracking-wider">Угроза убежища</h3>
                                <div class="mb-1 text-white font-bold text-xs">${game.state.threat.name}</div>
                                <div class="text-gray-400 mb-2 text-[11px] flex-grow">${game.state.threat.desc}</div>
                                <div class="p-2 rounded text-[11px] ${sim.threatResolved ? 'bg-green-900/20 border-green-800 text-green-400' : 'bg-red-900/20 border-red-800 text-red-400'} border font-bold">
                                    ${sim.threatResolved ? '✓ Угроза успешно устранена' : '✗ Угроза не устранена (-10 к Медицине и Психике)'}
                                </div>
                            </div>
                        </div>

                        <h3 class="text-xs font-bold text-green-400 mb-2 uppercase tracking-wider">Попавшие в бункер (выжившие):</h3>
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-4">
                            ${survivors.map(c => renderCandidateCard(c, false)).join('')}
                        </div>

                        ${eliminated.length > 0 ? `
                            <h3 class="text-xs font-bold text-red-400 mb-2 uppercase tracking-wider">Не попавшие в бункер (изгнанные):</h3>
                            <div class="grid grid-cols-1 md:grid-cols-5 gap-2 mb-4">
                                ${eliminated.map(c => renderCandidateCard(c, true)).join('')}
                            </div>
                        ` : ''}

                        <div class="text-center mt-3">
                            <button onclick="game.state.view='menu'; ui.render();" class="bg-bunker-700 hover:bg-gray-600 px-6 py-2 rounded text-white font-bold text-xs transition">В главное меню</button>
                        </div>
                    </div>
                </div>`;
            }
        };

        game.init();
    </script>
</body>
</html>
